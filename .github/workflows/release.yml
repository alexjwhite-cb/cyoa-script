name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: auto

jobs:
  build-cli:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build -p cyoa-cli --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"-windows"* ]]; then
            cp target/${{ matrix.target }}/release/cyoa-cli.exe dist/cyoa-${{ matrix.name }}.exe
          else
            cp target/${{ matrix.target }}/release/cyoa-cli dist/cyoa-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cyoa-cli-${{ matrix.name }}
          path: dist/

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: |
          wasm-pack build cyoa-wasm --target web --out-dir pkg

      - uses: actions/upload-artifact@v4
        with:
          name: cyoa-wasm
          path: cyoa-wasm/pkg/

  build-native:
    name: Build Native C-ABI Libraries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build Native
        run: cargo build -p cyoa-native --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/lib dist/include
          if [[ "${{ matrix.target }}" == *"-windows"* ]]; then
            cp target/${{ matrix.target }}/release/cyoa_native.dll dist/lib/
          elif [[ "${{ matrix.target }}" == *"-darwin"* ]]; then
            cp target/${{ matrix.target }}/release/libcyoa_native.dylib dist/lib/
          else
            cp target/${{ matrix.target }}/release/libcyoa_native.so dist/lib/
          fi
          cp cyoa-native/include/cyoa.h dist/include/

      - uses: actions/upload-artifact@v4
        with:
          name: cyoa-native-${{ matrix.name }}
          path: dist/

  build-android:
    name: Build Android Libraries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-ndk
        run: |
          pip3 install --user cmake
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk

      - name: Build Android
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a build -p cyoa-native --release
          mkdir -p dist-android/include dist-android/lib/arm64-v8a dist-android/lib/armeabi-v7a
          cp cyoa-native/include/cyoa.h dist-android/include/
          cp target/aarch64-linux-android/release/libcyoa_native.so dist-android/lib/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libcyoa_native.so dist-android/lib/armeabi-v7a/

      - uses: actions/upload-artifact@v4
        with:
          name: cyoa-native-android
          path: dist-android/

  build-ios:
    name: Build iOS Libraries
    runs-on: macos-latest
    # iOS cross-compilation requires the Xcode/iOS SDK, which is only available on macOS.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Install cargo-lipo
        run: cargo install cargo-lipo

      - name: Build iOS
        run: |
          rustup target add aarch64-apple-ios x86_64-apple-ios
          cargo lipo -p cyoa-native --release
          mkdir -p dist-ios/include dist-ios/lib
          cp cyoa-native/include/cyoa.h dist-ios/include/
          cp target/universal/release/libcyoa_native.a dist-ios/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: cyoa-native-ios
          path: dist-ios/

  deploy:
    name: Create GitHub Release
    needs: [build-cli, build-wasm, build-native, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cyoa-cli-*/**/*
            artifacts/cyoa-wasm/**/*
            artifacts/cyoa-native-*/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    name: Deploy Web Demo to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to gh-pages branch

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: |
          wasm-pack build cyoa-wasm --target web --out-dir pkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs build deps
        run: npm install

      - name: Prepare web-demo for deployment
        run: |
          # Deploy at root so index.html's ../cyoa-wasm/pkg/ and ../examples/ paths work
          mkdir -p _site/cyoa-wasm/pkg _site/examples _site/web-demo _site/docs
          cp cyoa-wasm/pkg/cyoa_wasm.js _site/cyoa-wasm/pkg/
          cp cyoa-wasm/pkg/cyoa_wasm_bg.wasm _site/cyoa-wasm/pkg/
          cp cyoa-wasm/pkg/cyoa_wasm.d.ts _site/cyoa-wasm/pkg/
          cp examples/*.cyoa.bc _site/examples/
          cp web-demo/index.html _site/web-demo/
          cp web-demo/cyoa.d.ts _site/web-demo/
          # Build docs as rendered HTML pages (not raw .md)
          node docs-site/build-site.js
          # Root redirect to web demo (primary entry point on release)
          printf '%s\n' '<!doctype html>' '<html>' '<head>' '<meta charset="utf-8">' '<meta http-equiv="refresh" content="0; url=./web-demo/">' '<title>CYOA Engine — Redirecting</title>' '</head>' '<body>' '<p>Redirecting to the <a href="./web-demo/">web demo</a>…</p>' '</body>' '</html>' > _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
