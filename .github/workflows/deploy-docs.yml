name: Deploy Docs

# This workflow builds and deploys the documentation website (HTML pages) to
# GitHub Pages without requiring a release tag or rebuilding WASM.
# Triggered by:
# - Manual dispatch (workflow_dispatch)
# - Pushes to docs/, web-demo/, README.md, docs-site/, package.json, or this workflow

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'web-demo/**'
      - 'README.md'
      - 'docs-site/**'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release WASM artifacts
        run: |
          mkdir -p _site/cyoa-wasm/pkg _site/examples _site/web-demo
          # Download the WASM package and CLI/binary artifacts from the latest release
          # This avoids rebuilding WASM — WASM is only changed on release
          gh release download --pattern "cyoa-wasm" --dir _site_wasm 2>/dev/null || echo "No WASM release found — docs-only deploy"
          if [ -d _site_wasm/cyoa-wasm ]; then
            cp -r _site_wasm/cyoa-wasm/* _site/cyoa-wasm/pkg/ 2>/dev/null || true
          fi
          # Also fetch example bytecode from the release
          gh release download --pattern "*examples*" --dir _site_wasm 2>/dev/null || true
          if [ -d _site_wasm ]; then
            find _site_wasm -name "*.cyoa.bc" -exec cp {} _site/examples/ \; 2>/dev/null || true
          fi
          # Fetch native libraries for C-ABI docs reference
          gh release download --pattern "cyoa-native-*" --dir _site_wasm 2>/dev/null || true
          rm -rf _site_wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs build deps
        run: npm install

      - name: Build docs site HTML
        run: node docs-site/build-site.js --output-dir _site/docs

      - name: Copy web-demo entry point
        run: |
          cp web-demo/index.html _site/web-demo/
          cp web-demo/cyoa.d.ts _site/web-demo/ 2>/dev/null || true

      - name: Root redirect
        run: |
          printf '%s\n' '<!doctype html>' '<html>' '<head>' '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./docs/">' \
            '<title>CYOA Engine — Redirecting</title>' '</head>' '<body>' \
            '<p>Redirecting to the <a href="./docs/">documentation site</a>…</p>' \
            '</body>' '</html>' > _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
