name: Deploy Docs

# This workflow builds and deploys the documentation website (HTML pages) to
# GitHub Pages without requiring a release tag or rebuilding WASM.
# Triggered by:
# - Manual dispatch (workflow_dispatch)
# - Pushes to docs/, web-demo/, README.md, docs-site/, package.json, or this workflow

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'web-demo/**'
      - 'README.md'
      - 'docs-site/**'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download latest release WASM artifacts
        run: |
          mkdir -p _site/cyoa-wasm/pkg _site/examples _site/web-demo
          # Download WASM bindings from the latest release
          # (avoids rebuilding WASM — WASM is only changed on release)
          rm -rf release_wasm
          echo "Downloading WASM assets from latest release..."
          gh release download --pattern "*cyoa_wasm*" --dir release_wasm --repo alexjwhite/cyoa-script 2>&1 || echo "  gh release download failed, trying alternate pattern..."

          # If the first download didn't get the files, try a broader approach
          if [ ! -d release_wasm ] || [ -z "$(ls -A release_wasm 2>/dev/null)" ]; then
            echo "  Trying to list release assets and download individually..."
            ASSETS=$(gh release view --json assets -q '.assets[].name' --repo alexjwhite/cyoa-script 2>/dev/null || echo "")
            echo "  Available assets: $ASSETS" | tr ' ' '\n' | head -20

            for asset in $ASSETS; do
              if echo "$asset" | grep -q "cyoa_wasm"; then
                echo "  Downloading asset: $asset"
                gh release download --asset "$asset" --dir release_wasm --repo alexjwhite/cyoa-script 2>/dev/null || true
              fi
            done
          fi

          # Find all cyoa_wasm files recursively (they may be in nested dirs)
          if [ -d release_wasm ]; then
            find release_wasm -name 'cyoa_wasm*' -exec cp {} _site/cyoa-wasm/pkg/ \;
            echo "  WASM files in _site/cyoa-wasm/pkg/: $(ls _site/cyoa-wasm/pkg/ 2>/dev/null)"
          else
            echo "  WARNING: No WASM files downloaded — web demo may not load engine"
          fi
          rm -rf release_wasm
          # Copy example bytecode from the repo (not released as artifacts)
          cp examples/*.cyoa.bc _site/examples/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs build deps
        run: npm install

      - name: Build docs site HTML
        run: node docs-site/build-site.js --output-dir _site/docs

      - name: Copy web-demo entry point
        run: |
          cp web-demo/index.html _site/web-demo/
          cp web-demo/cyoa.d.ts _site/web-demo/ 2>/dev/null || true

      - name: Root redirect
        run: |
          printf '%s\n' '<!doctype html>' '<html>' '<head>' '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./web-demo/">' \
            '<title>CYOA Engine — Redirecting</title>' '</head>' '<body>' \
            '<p>Redirecting to the <a href="./web-demo/">web demo</a>…</p>' \
            '</body>' '</html>' > _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
