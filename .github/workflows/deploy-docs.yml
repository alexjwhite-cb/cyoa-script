name: Deploy Docs

# This workflow builds and deploys the documentation website (HTML pages) to
# GitHub Pages without requiring a release tag or rebuilding WASM.
# Triggered by:
# - Manual dispatch (workflow_dispatch)
# - Pushes to docs/, web-demo/, README.md, docs-site/, package.json, or this workflow

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'web-demo/**'
      - 'README.md'
      - 'docs-site/**'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download latest release WASM artifacts
        run: |
          mkdir -p _site/cyoa-wasm/pkg _site/examples _site/web-demo
          # Download WASM bindings from the latest release
          # (avoids rebuilding WASM — WASM is only changed on release)
          # Uses the GitHub API to find the latest release tag and asset list,
          # then downloads each cyoa_wasm* file via curl (no auth needed for
          # public repos' release asset download URLs).
          echo "Fetching latest release info from GitHub API..."

          RELEASE_JSON=$(curl -sL "https://api.github.com/repos/alexjwhite-cb/cyoa-script/releases/latest")
          RELEASE_TAG=$(echo "$RELEASE_JSON" | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/"tag_name": *"\([^"]*\)"/\1/')

          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
            echo "  WARNING: No published release found — web demo may not load engine"
          else
            echo "  Latest release tag: $RELEASE_TAG"
            # Extract asset names from the release JSON
            ASSETS=$(echo "$RELEASE_JSON" | grep -o '"name": *"[^"]*"' | sed 's/"name": *"\([^"]*\)"/\1/' | tr -d '"')

            # Download each cyoa_wasm* asset
            for asset in $ASSETS; do
              if echo "$asset" | grep -q "cyoa_wasm"; then
                echo "  Downloading $asset..."
                curl -sL "https://github.com/alexjwhite-cb/cyoa-script/releases/download/${RELEASE_TAG}/${asset}" \
                  -o "_site/cyoa-wasm/pkg/${asset}"
              fi
            done
          fi

          echo "  WASM files in _site/cyoa-wasm/pkg/: $(ls _site/cyoa-wasm/pkg/ 2>/dev/null)"
          # Copy example bytecode from the repo (not released as artifacts)
          cp examples/*.cyoa.bc _site/examples/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs build deps
        run: npm install

      - name: Build docs site HTML
        run: node docs-site/build-site.js --output-dir _site/docs

      - name: Copy web-demo entry point
        run: |
          cp web-demo/index.html _site/web-demo/
          cp web-demo/cyoa.d.ts _site/web-demo/ 2>/dev/null || true

      - name: Root redirect
        run: |
          printf '%s\n' '<!doctype html>' '<html>' '<head>' '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./web-demo/">' \
            '<title>CYOA Engine — Redirecting</title>' '</head>' '<body>' \
            '<p>Redirecting to the <a href="./web-demo/">web demo</a>…</p>' \
            '</body>' '</html>' > _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
